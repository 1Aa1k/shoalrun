<head>

<title>shoalrun - Millinocket Lake</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden;
  background: #0d1117; color: #c9d1d9;
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

.alert { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0;
  padding: 14px 16px; font-size: 20px; font-weight: 700; letter-spacing: .02em;
  text-align: center; transition: background .15s; }
.alert.clear   { background: rgba(22,27,34,.82); color: #7d8590; font-weight: 600; font-size: 15px; }
.alert.caution { background: #b26a00; color: #fff; }
.alert.danger  { background: #c92a1c; color: #fff; animation: pulse .7s infinite alternate; }
@keyframes pulse { to { background: #ff3b26; } }

.bar { position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0));
  background: rgba(13,17,23,.9); border-top: 1px solid #21262d;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 8px; padding: 9px 13px; font-size: 14px; font-weight: 600; }
button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #7d8590; }
#status, #counts, #meta { font-size: 12px; color: #7d8590; width: 100%; }
#status.ok { color: #3fb950; } #status.warn { color: #d29922; }

.legend { position: absolute; top: 74px; left: 12px;
  background: rgba(22,27,34,.85); border: 1px solid #30363d; border-radius: 8px;
  padding: 8px 10px; font-size: 12px; }
.legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; }

.sheet { position: absolute; left: 0; right: 0; bottom: -100%;
  background: #161b22; border-top: 1px solid #30363d;
  border-radius: 14px 14px 0 0; padding: 16px;
  transition: bottom .18s ease-out; z-index: 10; }
.sheet.open { bottom: 0; }
.sheet h3 { margin: 0 0 10px; font-size: 17px; }
.kv { display: flex; justify-content: space-between; padding: 5px 0;
  border-bottom: 1px solid #21262d; font-size: 13px; color: #7d8590; }
.kv b { color: #c9d1d9; font-weight: 600; }
.sheet .row { display: flex; gap: 8px; margin-top: 12px; }
.sheet .row button { flex: 1; }
#btnConfirm { background: #8b1a10; border-color: #a52a1a; color: #fff; }
#btnAbsent  { background: #21262d; }

body.sim::after { content: "SIMULATION"; position: absolute; top: 50%; left: 0; right: 0;
  text-align: center; font-size: 42px; font-weight: 800; color: rgba(255,255,255,.07);
  pointer-events: none; letter-spacing: .1em; }

.disclaimer { position: absolute; top: 74px; right: 12px; max-width: 190px;
  background: rgba(201,42,28,.14); border: 1px solid rgba(201,42,28,.5);
  color: #f0a89f; border-radius: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.35; }
</style>
</head>

  </div>
</div>

  <div id="counts"></div>
  <div id="meta"></div>
</div>

function makeProjection(centerLat, centerLon) {
  const R = 6378137;
  const latRad = (centerLat * Math.PI) / 180;
  const mPerDegLat = (Math.PI / 180) * R;
  const mPerDegLon = mPerDegLat * Math.cos(latRad);

  return {
    // lon/lat -> metres east/north of the lake centre
    fwd(lon, lat) {
      return [(lon - centerLon) * mPerDegLon, (lat - centerLat) * mPerDegLat];
    },
    inv(x, y) {
      return [centerLon + x / mPerDegLon, centerLat + y / mPerDegLat];
    },
    mPerDegLat,
    mPerDegLon,
  };
}

// Great-circle distance in metres. Used for alert ranges, where being wrong by
// a metre matters more than it does for drawing.
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p = Math.PI / 180;
  const dLat = (lat2 - lat1) * p;
  const dLon = (lon2 - lon1) * p;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Shortest distance from point P to segment AB, all in projected metres.
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// Uniform grid bucket index. The candidate count is in the hundreds, so this
// is not about asymptotics -- it is about keeping the per-GPS-fix scan bounded
// and predictable so the phone does not heat up over a long day on the water.
class GridIndex {
  constructor(cellSize = 200) {
    this.cell = cellSize;
    this.buckets = new Map();
  }

  _key(x, y) {
    return `${Math.floor(x / this.cell)},${Math.floor(y / this.cell)}`;
  }

  insert(x, y, item) {
    const k = this._key(x, y);
    let b = this.buckets.get(k);
    if (!b) this.buckets.set(k, (b = []));
    b.push(item);
  }

  // Everything within `radius` metres of (x,y), plus slop at the cell edges.
  query(x, y, radius) {
    const out = [];
    const r = Math.ceil(radius / this.cell);
    const cx = Math.floor(x / this.cell);
    const cy = Math.floor(y / this.cell);
    for (let i = cx - r; i <= cx + r; i++) {
      for (let j = cy - r; j <= cy + r; j++) {
        const b = this.buckets.get(`${i},${j}`);
        if (b) out.push(...b);
      }
    }
    return out;
  }
}

// Hazard scanning: given a GPS fix, decide what is worth interrupting a boater
// for. The hard constraint is that a false alarm costs more than nothing -- a
// tool that cries wolf gets switched off, and then it protects nobody.

// How far ahead to look, as seconds of travel at current speed. Below a floor
// speed we stop projecting entirely, because course over ground from GPS is
// meaningless when drifting and would swing the corridor wildly.
const LOOKAHEAD_S = 20;
const MIN_SPEED_MS = 1.5; // ~3 kn; below this, moored/drifting
const MIN_CORRIDOR_M = 60; // never look less than this far ahead
const MAX_CORRIDOR_M = 600; // cap the projection at ~35 kn * 20 s

// Half-width of the danger corridor. Wider than the boat because GPS is good to
// a few metres, the rock centroid is good to ~10 m (one Sentinel pixel), and a
// boat does not turn on a dime.
const CORRIDOR_HALF_W = 35;

// Alert tiers by class. `drawdown` outranks `exposed` deliberately: an exposed
// ledge is one your friend can see out the windshield, while a drawdown rock is
// invisible at full pond and is the one that takes a lower unit off.
const SEVERITY = { drawdown: 3, shoal: 2, exposed: 1 };
function severityOf(cls) {
  return SEVERITY[cls] ?? 1;
}

/**
 * Scan for hazards in the projected path corridor.
 *
 * @param {{x:number,y:number}} pos     boat position, projected metres
 * @param {number} headingRad           course over ground, radians (0 = east)
 * @param {number} speedMs              speed over ground, m/s
 * @param {GridIndex} index             spatial index of rock candidates
 * @param {Set<string>} dismissed       ids the user marked "not there"
 * @returns {{list:Array, worst:object|null}}
 */
function scan(pos, headingRad, speedMs, index, dismissed) {
  const moving = speedMs >= MIN_SPEED_MS && Number.isFinite(headingRad);

  const reach = moving
    ? Math.min(MAX_CORRIDOR_M, Math.max(MIN_CORRIDOR_M, speedMs * LOOKAHEAD_S))
    : MIN_CORRIDOR_M;

  // When stopped or drifting we fall back to a plain radius, because there is
  // no trustworthy direction to project along.
  const ax = pos.x;
  const ay = pos.y;
  const bx = moving ? ax + Math.cos(headingRad) * reach : ax;
  const by = moving ? ay + Math.sin(headingRad) * reach : ay;

  const searchR = reach + CORRIDOR_HALF_W;
  const near = index.query(ax, ay, searchR);

  const hits = [];
  for (const rock of near) {
    if (dismissed.has(rock.id)) continue;

    const d = moving
      ? distToSegment(rock.x, rock.y, ax, ay, bx, by)
      : Math.hypot(rock.x - ax, rock.y - ay);

    const limit = moving ? CORRIDOR_HALF_W : MIN_CORRIDOR_M;
    if (d > limit) continue;

    // Straight-line range to the rock, and time to reach it at current speed.
    const range = Math.hypot(rock.x - ax, rock.y - ay);
    const ttc = moving && speedMs > 0 ? range / speedMs : Infinity;

    hits.push({ rock, offTrack: d, range, ttc, severity: severityOf(rock.cls) });
  }

  // Rank by time-to-contact first -- what you will hit soonest is what matters,
  // regardless of how bad it is in the abstract. Severity breaks ties.
  hits.sort((a, b) => a.ttc - b.ttc || b.severity - a.severity || a.range - b.range);

  return { list: hits, worst: hits[0] ?? null, reach, moving };
}

// Alert level from the top hit. Hysteresis lives in the caller; this is a pure
// function of the current scan so it is trivially testable.
function alertLevel(worst) {
  if (!worst) return "clear";
  if (worst.ttc <= 6 || worst.range <= 40) return "danger";
  if (worst.ttc <= 15 || worst.range <= 120) return "caution";
  return "clear";
}

// Canvas renderer. Deliberately no map tiles: the lake has no cell service, so
// the shoreline is drawn from the vector polygon that ships inside the app.
// That makes the map work at full fidelity offline with nothing cached.

const COLORS = {
  water: "#0b2942",
  waterDeep: "#081f33",
  land: "#141a1f",
  shore: "#3f6d94",
  track: "rgba(120, 200, 255, 0.35)",
  boat: "#ffffff",
  corridor: "rgba(255, 210, 90, 0.13)",
  corridorEdge: "rgba(255, 210, 90, 0.35)",
  exposed: "#8b9aa6",
  drawdown: "#ff5b4a",
  shoal: "#ffb02e",
  confirmed: "#ff2d1a",
  absent: "#3a4750",
};

const CLASS_COLOR = {
  exposed: COLORS.exposed,
  drawdown: COLORS.drawdown,
  shoal: COLORS.shoal,
};
class MapView {
  constructor(canvas, proj) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.proj = proj;
    this.scale = 0.08; // px per metre
    this.center = { x: 0, y: 0 };
    this.rotation = 0; // radians; course-up when following
    this.follow = true;
    this.courseUp = true;
    this._resize();
    window.addEventListener("resize", () => this._resize());
  }

  _resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = this.canvas.getBoundingClientRect();
    this.canvas.width = Math.round(r.width * dpr);
    this.canvas.height = Math.round(r.height * dpr);
    this.w = r.width;
    this.h = r.height;
    this.dpr = dpr;
  }

  // Projected metres -> screen px, honouring pan/zoom/rotation.
  toScreen(x, y) {
    const dx = (x - this.center.x) * this.scale;
    const dy = (y - this.center.y) * this.scale;
    const c = Math.cos(this.rotation);
    const s = Math.sin(this.rotation);
    // Screen y grows downward, so north (+y) must be negated.
    return [this.w / 2 + (dx * c - dy * s), this.h / 2 - (dx * s + dy * c)];
  }

  toWorld(sx, sy) {
    const px = (sx - this.w / 2) / this.scale;
    const py = -(sy - this.h / 2) / this.scale;
    const c = Math.cos(-this.rotation);
    const s = Math.sin(-this.rotation);
    return { x: this.center.x + (px * c - py * s), y: this.center.y + (px * s + py * c) };
  }

  _ring(ring) {
    const ctx = this.ctx;
    ctx.beginPath();
    for (let i = 0; i < ring.length; i++) {
      const [sx, sy] = this.toScreen(ring[i][0], ring[i][1]);
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
  }

  draw(state) {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);

    // Land background, then water punched out. Drawing it this way means the
    // 74 islands come free as polygon holes instead of needing a second pass.
    ctx.fillStyle = COLORS.land;
    ctx.fillRect(0, 0, this.w, this.h);

    ctx.save();
    ctx.fillStyle = COLORS.water;
    ctx.beginPath();
    for (const poly of state.lake) {
      for (const ring of poly) {
        for (let i = 0; i < ring.length; i++) {
          const [sx, sy] = this.toScreen(ring[i][0], ring[i][1]);
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
      }
    }
    ctx.fill("evenodd");
    ctx.restore();

    // Shoreline stroke on top for a crisp edge at any zoom.
    ctx.strokeStyle = COLORS.shore;
    ctx.lineWidth = 1;
    for (const poly of state.lake) {
      for (const ring of poly) {
        this._ring(ring);
        ctx.stroke();
      }
    }

    if (state.track && state.track.length > 1) this._drawTrack(state.track);
    if (state.corridor) this._drawCorridor(state.corridor);
    this._drawRocks(state);
    if (state.fix) this._drawBoat(state);
  }

  _drawTrack(track) {
    const ctx = this.ctx;
    ctx.strokeStyle = COLORS.track;
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < track.length; i++) {
      const [sx, sy] = this.toScreen(track[i].x, track[i].y);
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  _drawCorridor(c) {
    const ctx = this.ctx;
    const [ax, ay] = this.toScreen(c.ax, c.ay);
    const [bx, by] = this.toScreen(c.bx, c.by);
    const w = c.halfW * this.scale;
    const ang = Math.atan2(by - ay, bx - ax);
    const nx = Math.cos(ang + Math.PI / 2) * w;
    const ny = Math.sin(ang + Math.PI / 2) * w;

    ctx.fillStyle = COLORS.corridor;
    ctx.strokeStyle = COLORS.corridorEdge;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ax + nx, ay + ny);
    ctx.lineTo(bx + nx, by + ny);
    ctx.lineTo(bx - nx, by - ny);
    ctx.lineTo(ax - nx, ay - ny);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  _drawRocks(state) {
    const ctx = this.ctx;
    for (const r of state.rocks) {
      const [sx, sy] = this.toScreen(r.x, r.y);
      if (sx < -30 || sy < -30 || sx > this.w + 30 || sy > this.h + 30) continue;

      const mark = state.marks.get(r.id);
      const verdict = mark && mark.verdict;
      if (verdict === "absent") {
        // Kept visible but greyed: the user said it is not there, and hiding it
        // outright would make a mistaken dismissal permanent and invisible.
        ctx.globalAlpha = 0.35;
      }

      const color =
        verdict === "confirmed" ? COLORS.confirmed : CLASS_COLOR[r.cls] || COLORS.exposed;

      // Radius from footprint, floored so a one-pixel rock is still tappable.
      const rad = Math.max(4, Math.sqrt(r.area_m2 / Math.PI) * this.scale);

      ctx.beginPath();
      ctx.arc(sx, sy, rad, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha *= verdict === "confirmed" ? 0.9 : 0.55;
      ctx.fill();
      ctx.globalAlpha = verdict === "absent" ? 0.35 : 1;
      ctx.lineWidth = verdict === "confirmed" ? 2.5 : 1.5;
      ctx.strokeStyle = color;
      ctx.stroke();

      if (verdict === "confirmed") {
        ctx.beginPath();
        ctx.arc(sx, sy, rad + 4, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.6;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  _drawBoat(state) {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(state.fix.x, state.fix.y);

    // Accuracy circle, so the user can see when the fix itself is the problem.
    if (state.fix.accuracy) {
      ctx.beginPath();
      ctx.arc(sx, sy, state.fix.accuracy * this.scale, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.fill();
    }

    ctx.save();
    ctx.translate(sx, sy);
    // Heading is a bearing in world space; the view may itself be rotated.
    ctx.rotate(-(state.heading ?? Math.PI / 2) + Math.PI / 2 - this.rotation);
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(7, 9);
    ctx.lineTo(0, 5);
    ctx.lineTo(-7, 9);
    ctx.closePath();
    ctx.fillStyle = COLORS.boat;
    ctx.fill();
    ctx.strokeStyle = "#0b2942";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  hitTest(sx, sy, rocks, radiusPx = 22) {
    let best = null;
    let bestD = radiusPx;
    for (const r of rocks) {
      const [x, y] = this.toScreen(r.x, r.y);
      const d = Math.hypot(x - sx, y - sy);
      if (d < bestD) {
        bestD = d;
        best = r;
      }
    }
    return best;
  }
}

// Local persistence. Everything lives on the phone: the lake has no signal, so
// there is no server to sync to mid-trip, and a boating tool that needs a
// network to work is a boating tool that fails exactly when it matters.
//
// Two stores, both feeding the ground-truth loop:
//   tracks      GPS breadcrumbs. Water the boat has actually driven through is
//               proof that water is clear -- passive negative evidence that
//               costs the user nothing to produce.
//   marks       Explicit human verdicts on candidates, plus rocks the user adds
//               from their own knowledge. Positive evidence.

const DB_NAME = "shoalrun";
const DB_VERSION = 1;

let dbp = null;

function open() {
  if (dbp) return dbp;
  dbp = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("tracks")) {
        const s = db.createObjectStore("tracks", { keyPath: "t" });
        s.createIndex("trip", "trip");
      }
      if (!db.objectStoreNames.contains("marks")) {
        db.createObjectStore("marks", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbp;
}

function tx(store, mode, fn) {
  return open().then(
    (db) =>
      new Promise((resolve, reject) => {
        const t = db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => resolve(req && req.result);
        t.onerror = () => reject(t.error);
      })
  );
}

// --- track logging ---------------------------------------------------------

// Breadcrumbs are only worth keeping when the boat is actually moving and the
// fix is decent. Logging a drifting boat at the dock all afternoon would bury
// the useful data and imply "safe water" where the boat never really went.
const TRACK_MIN_SPEED_MS = 1.0;
const TRACK_MAX_ACC_M = 25;
async function logFix(trip, fix) {
  if (fix.speed == null || fix.speed < TRACK_MIN_SPEED_MS) return false;
  if (fix.accuracy != null && fix.accuracy > TRACK_MAX_ACC_M) return false;
  await tx("tracks", "readwrite", (s) =>
    s.put({
      t: fix.t,
      trip,
      lat: +fix.lat.toFixed(6),
      lon: +fix.lon.toFixed(6),
      spd: +fix.speed.toFixed(2),
      acc: fix.accuracy == null ? null : Math.round(fix.accuracy),
    })
  );
  return true;
}
function allTracks() {
  return tx("tracks", "readonly", (s) => s.getAll());
}
function trackCount() {
  return tx("tracks", "readonly", (s) => s.count());
}

// --- human verdicts --------------------------------------------------------

// `verdict` is one of: confirmed | absent | unsure. `absent` is what suppresses
// a candidate from alerting; it is the user overriding the detector, which is
// the whole point of having a person who lives on the lake in the loop.
async function setMark(id, verdict, note, extra = {}) {
  await tx("marks", "readwrite", (s) =>
    s.put({ id, verdict, note: note || "", t: Date.now(), ...extra })
  );
}
function allMarks() {
  return tx("marks", "readonly", (s) => s.getAll());
}
async function clearMark(id) {
  await tx("marks", "readwrite", (s) => s.delete(id));
}

// --- export ----------------------------------------------------------------

// The export is the handoff back into the offline pipeline: tracks retrain the
// false-positive filter, marks become labels. Plain GeoJSON so it opens in
// anything.
async function exportAll() {
  const [tracks, marks] = await Promise.all([allTracks(), allMarks()]);

  const byTrip = new Map();
  for (const p of tracks) {
    if (!byTrip.has(p.trip)) byTrip.set(p.trip, []);
    byTrip.get(p.trip).push(p);
  }

  const features = [];
  for (const [trip, pts] of byTrip) {
    pts.sort((a, b) => a.t - b.t);
    if (pts.length < 2) continue;
    features.push({
      type: "Feature",
      properties: {
        kind: "track",
        trip,
        points: pts.length,
        start: new Date(pts[0].t).toISOString(),
        end: new Date(pts[pts.length - 1].t).toISOString(),
      },
      geometry: { type: "LineString", coordinates: pts.map((p) => [p.lon, p.lat]) },
    });
  }

  for (const m of marks) {
    features.push({
      type: "Feature",
      properties: {
        kind: "mark",
        id: m.id,
        verdict: m.verdict,
        note: m.note,
        at: new Date(m.t).toISOString(),
      },
      geometry:
        m.lat != null ? { type: "Point", coordinates: [m.lon, m.lat] } : null,
    });
  }

  return { type: "FeatureCollection", features };
}





// DATA is injected at build time so the app is one self-contained file with no
// network dependency of any kind. There is no cell service on this lake.
const { lake: LAKE_GEO, rocks: ROCK_GEO, meta: DATA_META } = window.SHOALRUN_DATA;

const el = (id) => document.getElementById(id);
const state = {
  lake: [],
  rocks: [],
  marks: new Map(),
  track: [],
  fix: null,
  heading: null,
  speed: 0,
  corridor: null,
  alert: "clear",
  trip: `trip-${Date.now()}`,
  logged: 0,
};

// --- geometry setup --------------------------------------------------------

const bounds = LAKE_GEO.bbox;
const proj = makeProjection((bounds[1] + bounds[3]) / 2, (bounds[0] + bounds[2]) / 2);

function ringsOf(geom) {
  if (geom.type === "Polygon") return [geom.coordinates];
  if (geom.type === "MultiPolygon") return geom.coordinates;
  return [];
}

for (const poly of ringsOf(LAKE_GEO.geometry)) {
  state.lake.push(poly.map((ring) => ring.map(([lon, lat]) => proj.fwd(lon, lat))));
}

const index = new GridIndex(200);
ROCK_GEO.features.forEach((f, i) => {
  const p = f.properties;
  const [x, y] = proj.fwd(p.lon, p.lat);
  const rock = {
    id: `r${i}`,
    cls: p.class,
    lat: p.lat,
    lon: p.lon,
    area_m2: p.area_m2,
    confidence: p.confidence,
    x,
    y,
  };
  state.rocks.push(rock);
  index.insert(x, y, rock);
});

const view = new MapView(el("map"), proj);
view.center = { x: 0, y: 0 };
view.scale = Math.min(
  view.w / ((bounds[2] - bounds[0]) * proj.mPerDegLon),
  view.h / ((bounds[3] - bounds[1]) * proj.mPerDegLat)
) * 0.92;
view.rotation = 0;
view.follow = false;

// --- marks -----------------------------------------------------------------

async function loadMarks() {
  const marks = await allMarks();
  state.marks = new Map(marks.map((m) => [m.id, m]));
  refreshCounts();
}

function dismissedSet() {
  const s = new Set();
  for (const [id, m] of state.marks) if (m.verdict === "absent") s.add(id);
  return s;
}

// --- GPS -------------------------------------------------------------------

let watchId = null;
let lastFix = null;

function onFix(pos) {
  const c = pos.coords;
  const [x, y] = proj.fwd(c.longitude, c.latitude);
  const t = pos.timestamp;

  // Prefer the device's own course/speed; fall back to differencing consecutive
  // fixes, because iOS Safari reports heading as null far more often than not.
  let speed = c.speed;
  let headingDeg = c.heading;

  if ((speed == null || Number.isNaN(speed)) && lastFix) {
    const dt = (t - lastFix.t) / 1000;
    if (dt > 0.5) speed = Math.hypot(x - lastFix.x, y - lastFix.y) / dt;
  }
  if ((headingDeg == null || Number.isNaN(headingDeg)) && lastFix) {
    const dx = x - lastFix.x;
    const dy = y - lastFix.y;
    if (Math.hypot(dx, dy) > 3) headingDeg = (90 - (Math.atan2(dy, dx) * 180) / Math.PI + 360) % 360;
  }

  speed = speed ?? 0;
  // Device heading is a compass bearing; the maths works in standard maths
  // angles (0 = +x = east, counter-clockwise).
  const headingRad = headingDeg == null ? null : ((90 - headingDeg) * Math.PI) / 180;

  state.fix = { x, y, lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, t };
  state.heading = headingRad;
  state.speed = speed;
  lastFix = { x, y, t };

  state.track.push({ x, y });
  if (state.track.length > 5000) state.track.shift();

  logFix(state.trip, {
    t,
    lat: c.latitude,
    lon: c.longitude,
    speed,
    accuracy: c.accuracy,
  }).then((ok) => {
    if (ok) state.logged++;
  });

  evaluate();

  if (view.follow) {
    view.center = { x, y };
    if (view.courseUp && headingRad != null && speed > 1.5) {
      view.rotation = headingRad - Math.PI / 2;
    }
  }
}

function onGpsError(err) {
  setStatus(`GPS: ${err.message}`, "warn");
}

function startGps() {
  if (!navigator.geolocation) return setStatus("no geolocation on this device", "warn");
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 15000,
  });
  setStatus("GPS active", "ok");
}

// --- hazard evaluation -----------------------------------------------------

// Hysteresis: an alert must clear for this long before the banner drops, so a
// hazard passing in and out of the corridor at the edge of tolerance does not
// produce a strobing warning that the user learns to ignore.
const CLEAR_HOLD_MS = 4000;
let lastDangerAt = 0;

function evaluate() {
  if (!state.fix) return;
  const result = scan(state.fix, state.heading, state.speed, index, dismissedSet());

  state.corridor = result.moving
    ? {
        ax: state.fix.x,
        ay: state.fix.y,
        bx: state.fix.x + Math.cos(state.heading) * result.reach,
        by: state.fix.y + Math.sin(state.heading) * result.reach,
        halfW: CORRIDOR_HALF_W,
      }
    : null;

  let level = alertLevel(result.worst);
  const now = Date.now();
  if (level !== "clear") lastDangerAt = now;
  else if (now - lastDangerAt < CLEAR_HOLD_MS) level = state.alert === "clear" ? "clear" : "caution";

  if (level !== state.alert) {
    state.alert = level;
    if (level === "danger") buzz([200, 80, 200]);
    else if (level === "caution") buzz([120]);
  }
  renderAlert(result);
}

function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
  if (el("sound").checked && state.alert === "danger") beep();
}

let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = 880;
    g.gain.value = 0.25;
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.18);
  } catch (_) {}
}

function renderAlert(result) {
  const banner = el("alert");
  banner.className = `alert ${state.alert}`;
  const w = result.worst;
  if (!w) {
    banner.textContent = result.moving ? "clear ahead" : "clear";
    return;
  }
  const label = w.rock.cls === "shoal" ? "SHOAL" : "ROCK";
  const dist = Math.round(w.range);
  const ttc = Number.isFinite(w.ttc) ? `  ${Math.round(w.ttc)}s` : "";
  banner.textContent =
    state.alert === "clear" ? `nearest ${label.toLowerCase()} ${dist} m` : `${label} ${dist} m${ttc}`;
}

// --- UI --------------------------------------------------------------------

function setStatus(msg, kind = "") {
  const s = el("status");
  s.textContent = msg;
  s.className = kind;
}

function refreshCounts() {
  const confirmed = [...state.marks.values()].filter((m) => m.verdict === "confirmed").length;
  const absent = [...state.marks.values()].filter((m) => m.verdict === "absent").length;
  el("counts").textContent =
    `${state.rocks.length} candidates - ${confirmed} confirmed, ${absent} dismissed`;
}

let selected = null;

el("map").addEventListener("click", (e) => {
  const r = el("map").getBoundingClientRect();
  const hit = view.hitTest(e.clientX - r.left, e.clientY - r.top, state.rocks);
  selected = hit;
  showSheet(hit);
});

function showSheet(rock) {
  const sheet = el("sheet");
  if (!rock) return sheet.classList.remove("open");
  const m = state.marks.get(rock.id);
  el("sheetTitle").textContent = rock.cls === "shoal" ? "Submerged shoal" : "Exposed rock";
  el("sheetBody").innerHTML =
    `<div class="kv"><span>position</span><b>${rock.lat.toFixed(5)}, ${rock.lon.toFixed(5)}</b></div>` +
    `<div class="kv"><span>footprint</span><b>${rock.area_m2} m&sup2;</b></div>` +
    `<div class="kv"><span>detector confidence</span><b>${rock.confidence}</b></div>` +
    `<div class="kv"><span>your verdict</span><b>${m ? m.verdict : "none"}</b></div>`;
  sheet.classList.add("open");
}

el("btnConfirm").onclick = async () => {
  if (!selected) return;
  await setMark(selected.id, "confirmed", "", { lat: selected.lat, lon: selected.lon });
  await loadMarks();
  showSheet(selected);
};
el("btnAbsent").onclick = async () => {
  if (!selected) return;
  await setMark(selected.id, "absent", "", { lat: selected.lat, lon: selected.lon });
  await loadMarks();
  showSheet(selected);
};
el("btnUnmark").onclick = async () => {
  if (!selected) return;
  await clearMark(selected.id);
  await loadMarks();
  showSheet(selected);
};
el("btnClose").onclick = () => el("sheet").classList.remove("open");

el("btnFollow").onclick = () => {
  view.follow = !view.follow;
  el("btnFollow").classList.toggle("on", view.follow);
  if (!view.follow) view.rotation = 0;
};

el("btnExport").onclick = async () => {
  const fc = await exportAll();
  const blob = new Blob([JSON.stringify(fc, null, 2)], { type: "application/geo+json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `shoalrun-${new Date().toISOString().slice(0, 10)}.geojson`;
  a.click();
};

// pan / zoom
let drag = null;
const map = el("map");
map.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, moved: 0 };
});
map.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  drag.moved += Math.hypot(dx, dy);
  const c = Math.cos(-view.rotation);
  const s = Math.sin(-view.rotation);
  view.center.x -= (dx * c - -dy * s) / view.scale;
  view.center.y += (dy * c + dx * s) / view.scale;
  drag.x = e.clientX;
  drag.y = e.clientY;
  view.follow = false;
  el("btnFollow").classList.remove("on");
});
map.addEventListener("pointerup", () => (drag = null));
map.addEventListener("wheel", (e) => {
  e.preventDefault();
  view.scale *= e.deltaY < 0 ? 1.12 : 0.89;
  view.scale = Math.max(0.01, Math.min(4, view.scale));
}, { passive: false });

// --- simulation ------------------------------------------------------------
// Drives a synthetic boat so the alert logic can be exercised without standing
// on the water. Explicitly opt-in via ?sim=1 -- it must never be mistaken for a
// real fix, so it is labelled loudly while running.

// lastStep starts at -Infinity so the first fix lands on the very first frame
// instead of after a full second of blank map.
const sim = { on: false, t: 0, px: 0, py: 0, hdg: 0.6, lastStep: -Infinity };

function startSim() {
  document.body.classList.add("sim");
  setStatus("SIMULATION - not real GPS", "warn");
  // Start in the island-studded eastern arm, which is where the hazards are.
  const start = proj.fwd(-68.79, 45.745);
  sim.px = start[0];
  sim.py = start[1];
  sim.on = true;
  view.follow = true;
  view.scale = 0.35;
  stepSim(performance.now());
}

// Driven from the render loop rather than setInterval. Timers are throttled or
// suspended on hidden/background pages, which silently stalls the simulation --
// exactly what made this look broken under a headless screenshot.
function stepSim(now) {
  if (now - sim.lastStep < 1000) return;
  sim.lastStep = now;
  sim.t += 1;
  sim.hdg += Math.sin(sim.t / 18) * 0.05;
  const spd = 8; // ~16 kn
  sim.px += Math.cos(sim.hdg) * spd;
  sim.py += Math.sin(sim.hdg) * spd;
  const [lon, lat] = proj.inv(sim.px, sim.py);
  onFix({
    coords: {
      latitude: lat,
      longitude: lon,
      accuracy: 5,
      speed: spd,
      heading: (90 - (sim.hdg * 180) / Math.PI + 360) % 360,
    },
    timestamp: Date.now(),
  });
}

// --- boot ------------------------------------------------------------------

// A thrown exception inside a GPS callback would otherwise vanish into the
// console -- on a phone, on a boat, with nobody watching. Surface it where the
// user will actually see it, because a frozen map that still looks alive is the
// most dangerous failure this app can have.
window.addEventListener("error", (e) => {
  setStatus(`ERROR: ${e.message}`, "warn");
});
window.addEventListener("unhandledrejection", (e) => {
  setStatus(`ERROR: ${e.reason && e.reason.message ? e.reason.message : e.reason}`, "warn");
});

function frame(now) {
  if (sim.on) stepSim(now || performance.now());
  view.draw(state);
  requestAnimationFrame(frame);
}

el("meta").textContent = DATA_META.summary;
loadMarks().then(() => {
  trackCount().then((n) => {
    if (n) setStatus(`${n} logged track points on this device`, "ok");
  });
});
frame();

if (new URLSearchParams(location.search).get("sim") === "1") startSim();
else startGps();
</script>
</body>
</html>
